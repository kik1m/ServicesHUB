<!DOCTYPE html>
<html>
<head>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.es.mjs';

    mermaid.initialize({ 
        startOnLoad: false,
        theme: 'dark',
        flowchart: { htmlLabels: false }
    });
    
    async function test() {
      const code = `
graph TD
A["العملاء"] --> B("الواجهة")
      `.trim();
      const { svg } = await mermaid.render('graphDiv', code);
      const cleanSvg = DOMPurify.sanitize(svg, {
        USE_PROFILES: { svg: true, html: true },
        ADD_TAGS: ['style', 'foreignObject', 'div', 'span', 'p', 'br', 'b', 'i', 'strong', 'em', 'tspan', 'text', 'marker', 'defs', 'clipPath', 'use'],
        ADD_ATTR: ['style', 'class', 'id', 'xmlns', 'width', 'height', 'fill', 'stroke', 'stroke-width', 'viewBox', 'd', 'transform', 'x', 'y', 'dy', 'dx', 'text-anchor', 'dominant-baseline', 'marker-end', 'marker-start', 'refX', 'refY', 'markerWidth', 'markerHeight', 'orient', 'clip-path', 'rx', 'ry', 'cx', 'cy', 'r', 'points', 'x1', 'y1', 'x2', 'y2', 'href', 'xlink:href'],
      });
      document.body.innerHTML = cleanSvg;
      console.log(cleanSvg);
    }
    test();
  </script>
</head>
<body>
</body>
</html>
